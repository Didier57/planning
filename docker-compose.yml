services:

  db:
    image: mariadb:11
    container_name: planning-db
    volumes:
      - db-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_ROOT_PASSWORD=planning123
      - MYSQL_DATABASE=webcalendar
      - MYSQL_USER=webcalendar
      - MYSQL_PASSWORD=planning123
    restart: unless-stopped

  webcalendar:
    image: ghcr.io/didier57/planning:latest
    pull_policy: always
    container_name: planning-web
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - WEBCALENDAR_USE_ENV=true
      - WEBCALENDAR_DB_TYPE=mysqli
      - WEBCALENDAR_DB_HOST=db
      - WEBCALENDAR_DB_DATABASE=webcalendar
      - WEBCALENDAR_DB_LOGIN=webcalendar
      - WEBCALENDAR_DB_PASSWORD=planning123
      - WEBCALENDAR_DB_PERSISTENT=true
    restart: unless-stopped

volumes:
  db-data: